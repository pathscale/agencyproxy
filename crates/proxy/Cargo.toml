[package]
name = "agency-proxy"
description = "Small headless runtime that owns coding-agent processes and sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
agent-abstraction = "0.4.15"
agency-proxy-protocol.workspace = true
async-trait.workspace = true
clap.workspace = true
endpoint-libs = { workspace = true, features = ["ws-http1"] }
eyre.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
agency-proxy-client.workspace = true
libc = "0.2"
tempfile = "3"
tokio-tungstenite = "0.29"

[[bin]]
name = "agency-proxy"
path = "src/main.rs"
