[package]
name = "agency-proxy"
description = "Small headless runtime that owns coding-agent processes and sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
agent-abstraction = "^0.5"
agency-proxy-protocol.workspace = true
async-trait.workspace = true
clap.workspace = true
endpoint-libs = { workspace = true, features = ["ws-http1"] }
eyre.workspace = true
futures.workspace = true
nagoya.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
agency-proxy-client.workspace = true
# The WebSocket client the MCP tests drive the server with: nago-wss over a
# nagoya socket, the same stack the server speaks, and no tokio.
endpoint-libs = { workspace = true, features = ["ws-client"] }
libc = "0.2"
tempfile = "3"

[[bin]]
name = "agency-proxy"
path = "src/main.rs"
