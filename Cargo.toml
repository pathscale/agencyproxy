[workspace]
resolver = "3"
members = ["crates/client", "crates/protocol", "crates/proxy"]

[workspace.package]
version = "0.1.11"
edition = "2024"
license = "Apache-2.0"
publish = true
homepage = "https://github.com/pathscale/agencyproxy"
repository = "https://github.com/pathscale/agencyproxy"

[workspace.dependencies]
agency-proxy-protocol = { version = "^0.1.9", path = "crates/protocol" }
agency-proxy-client = { version = "^0.1.9", path = "crates/client" }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
endpoint-libs = { version = "^3.3", default-features = false, features = ["framed-transport"] }
eyre = "0.6"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[profile.release]
strip = true
lto = "thin"
