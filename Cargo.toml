[workspace]
resolver = "3"
members = ["crates/client", "crates/protocol", "crates/proxy"]

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
agency-proxy-protocol = { path = "crates/protocol" }
agency-proxy-client = { path = "crates/client" }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
endpoint-libs = { path = "../endpoint-libs", version = "2.1.3", default-features = false, features = ["framed-transport"] }
eyre = "0.6"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[profile.release]
strip = true
lto = "thin"
