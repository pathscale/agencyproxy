[workspace]
resolver = "3"
members = ["crates/client", "crates/protocol", "crates/proxy"]

[workspace.package]
version = "0.1.11"
edition = "2024"
license = "Apache-2.0"
publish = true
homepage = "https://github.com/pathscale/agencyproxy"
repository = "https://github.com/pathscale/agencyproxy"

[workspace.dependencies]
agency-proxy-protocol = { version = "^0.1", path = "crates/protocol" }
agency-proxy-client = { version = "^0.1", path = "crates/client" }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
# `nagoya-transport` is `NagoyaStream`, which presents a nagoya socket to the
# runtime-neutral framing directly, so no compat layer sits in between.
endpoint-libs = { version = "^3", default-features = false, features = ["framed-transport", "nagoya-transport"] }
eyre = "0.6"
futures = "0.3"
# `reactor` is sockets and signals; the scheduler, timers and `sync` are in the
# default set.
nagoya = { version = "^0.1", features = ["reactor"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
strip = true
lto = "thin"
