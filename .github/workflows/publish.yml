name: Publish

# Publish on a version bump, not on every push to master. Source paths are
# included so a re-run after a transient registry failure does not need a
# dummy version change. Existing versions exit cleanly.
on:
  push:
    branches: [master]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Package and verify, but do not upload'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Test
        run: cargo test --release

      - name: Package
        if: inputs.dry_run
        run: cargo package --workspace

      # Cargo knows which crates are publishable, what order they depend on
      # each other in, and which versions are already on the registry - it
      # warns and skips those. This used to say all of it again: a hand-kept
      # list of crate names in dependency order, a `cargo metadata` per crate
      # to read one field out of the same output, and a jq query against the
      # crates.io API per crate. Every line was a second copy of something
      # cargo already knew, and the copy is what goes stale when a crate is
      # added.
      #
      # No `--locked`: publishing one crate makes the next one's dependency on
      # it resolvable at the new version, which changes the lockfile, and
      # `--locked` would abort the sequence partway with some crates already
      # permanently live.
      - name: Publish
        if: '!inputs.dry_run'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace
