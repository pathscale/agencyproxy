name: Publish

# Publish on a version bump, not on every push to master. Source paths are
# included so a re-run after a transient registry failure does not need a
# dummy version change. Existing versions exit cleanly.
on:
  push:
    branches: [master]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Package and verify, but do not upload'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Are these versions already on crates.io?
        id: check
        shell: bash
        run: |
          set -euo pipefail
          version=""
          missing=""
          for crate_name in agency-proxy-protocol agency-proxy-client agency-proxy; do
            package_version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg name "$crate_name" '.packages[] | select(.name == $name) | .version')
            if [ -n "$version" ] && [ "$package_version" != "$version" ]; then
              echo "workspace package versions disagree: $version and $package_version" >&2
              exit 1
            fi
            version=$package_version
            published=$(curl -sS -H 'User-Agent: pathscale-ci' \
              "https://crates.io/api/v1/crates/$crate_name/versions" \
              | jq -r --arg v "$version" '.versions[]? | select(.num == $v) | .num' || true)
            if [ -n "$published" ]; then
              echo "$crate_name $version is already published"
            else
              missing="$missing $crate_name"
              echo "$crate_name $version is new"
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$missing" ]; then
            echo "already=false" >> "$GITHUB_OUTPUT"
          else
            echo "already=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.check.outputs.already == 'false'
        run: cargo build --release

      - name: Test
        if: steps.check.outputs.already == 'false'
        run: cargo test --release

      - name: Package dry run
        if: steps.check.outputs.already == 'false' && inputs.dry_run
        run: |
          cargo package -p agency-proxy-protocol --locked
          cargo package -p agency-proxy-client --locked --no-verify
          cargo package -p agency-proxy --locked --no-verify

      - name: Publish
        if: steps.check.outputs.already == 'false' && !inputs.dry_run
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set on this repository" >&2
            echo "Add it under Settings -> Secrets -> Actions." >&2
            exit 1
          fi
          for crate_name in agency-proxy-protocol agency-proxy-client agency-proxy; do
            published=$(curl -sS -H 'User-Agent: pathscale-ci' \
              "https://crates.io/api/v1/crates/$crate_name/versions" \
              | jq -r --arg v "$VERSION" '.versions[]? | select(.num == $v) | .num' || true)
            if [ -n "$published" ]; then
              echo "$crate_name $VERSION is already published; skipping"
            else
              cargo publish -p "$crate_name" --locked --registry crates-io
            fi
          done

      - name: Summary
        if: always()
        run: |
          {
            if [ '${{ steps.check.outputs.already }}' = 'true' ]; then
              echo "Nothing to publish: all AgencyProxy crates at \`${{ steps.check.outputs.version }}\` are already on crates.io."
              echo
              echo 'Bump `version` in Cargo.toml to cut a new release.'
            elif [ '${{ inputs.dry_run }}' = 'true' ]; then
              echo "Dry run: packaged AgencyProxy \`${{ steps.check.outputs.version }}\` without uploading."
            else
              echo "Published AgencyProxy \`${{ steps.check.outputs.version }}\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
