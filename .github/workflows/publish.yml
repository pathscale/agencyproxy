name: Publish

# Dispatch manually from master after local checks and rebase merge.
# A failed release can be dispatched again without a dummy version change.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: crates.io
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require master
        shell: sh
        run: test "$GITHUB_REF" = refs/heads/master
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Publish each workspace crate in dependency order so a rerun can resume
      # after a partial release. Check the exact crate/version on crates.io;
      # only a 404 permits an upload, and every lookup or upload error fails.
      #
      # No `--locked`: publishing one crate makes the next one's dependency on
      # it resolvable at the new version, which can update the lockfile.
      - name: Publish
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${CARGO_REGISTRY_TOKEN:-}" ] || { echo "CARGO_REGISTRY_TOKEN is required" >&2; exit 1; }
          version=$(cargo pkgid -p agency-proxy-protocol | sed -nE 's/.*[@#]([0-9][^@#]*)$/\1/p')
          [ -n "$version" ] || { echo "could not read workspace version from cargo pkgid" >&2; exit 1; }
          for crate in agency-proxy-protocol agency-proxy-client agency-proxy; do
            status=$(curl --silent --show-error --location --max-redirs 3 \
              --user-agent 'agencyproxy-publish (https://github.com/pathscale/agencyproxy)' \
              --connect-timeout 10 --max-time 30 \
              --output /dev/null --write-out '%{http_code}' \
              "https://crates.io/api/v1/crates/$crate/$version") || exit 1
            case "$status" in
              200) printf '%s %s is already on crates.io; skipping\n' "$crate" "$version" ;;
              404) cargo publish --registry crates-io -p "$crate" || exit 1 ;;
              *) printf 'crates.io returned HTTP %s for %s %s\n' "$status" "$crate" "$version" >&2; exit 1 ;;
            esac
          done
